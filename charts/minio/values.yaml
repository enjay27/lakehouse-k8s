mode: standalone

replicaCount: 1

image:
  repository: minio/minio
  pullPolicy: IfNotPresent
  tag: "RELEASE.2024-01-01T16-36-33Z"

imagePullSecrets: []
serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

auth:
  # Must match minio.accessKeyId in polaris/values.yaml. Polaris reads the
  # credential from the Secret (minio.existingSecret), but its inline fallback
  # says "minioadmin" -- keeping them identical avoids a split-brain if the
  # Secret reference is ever removed.
  rootUser: "minio"

  # INTENTIONALLY EMPTY. CLAUDE.md: Zero Hardcoded Credentials.
  # Pass at install time, sourced from the environment:
  #   helm upgrade --install benchmarks-minio ./minio -f minio/values.yaml \
  #     -n datahub-hynix --set-string auth.rootPassword="$MINIO_ROOT_PASSWORD"
  # templates/secret.yaml fails the render if this is left empty, rather than
  # silently installing MinIO with a blank root password.
  rootPassword: "minio"

  # Set to reuse a Secret you manage yourself. It must carry all six keys
  # listed in templates/secret.yaml -- Polaris and Argo read different names.
  existingSecret: ""

environment:
  MINIO_REGION: "us-east-1"
  MINIO_BROWSER_REDIRECT_URL: ""
  MINIO_SERVER_URL: ""

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  annotations: {}
  selectorLabels: {}
  volumesPerServer: 1

service:
  type: LoadBalancer
  port: 9000
  consolePort: 9001
  nodePort: ~
  consoleNodePort: ~
  annotations: {}
  clusterIP: ~

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: minio.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: 9000
  tls:
    - secretName: minio-tls
      hosts:
        - minio.example.com

consoleIngress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: minio-console.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: 9001
  tls:
    - secretName: minio-console-tls
      hosts:
        - minio-console.example.com

resources:
  requests:
    memory: "2Gi"
    cpu: "500m"
  limits:
    memory: "4Gi"
    cpu: "1000m"

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
  httpGet:
    path: /minio/health/live
    port: 9000
    scheme: HTTP

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
  httpGet:
    path: /minio/health/ready
    port: 9000
    scheme: HTTP

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

polaris:
  enabled: true
  # polaris/values.yaml sets warehouse: s3://data-catalog-bucket/
  # These two must agree or Polaris writes to a bucket that does not exist.
  defaultBucket: "data-catalog-bucket"
  sts:
    enabled: true
    tokenDuration: 3600
    maxSessionDuration: 43200

buckets:
  # REQUIRED by polaris/values.yaml -> warehouse: s3://data-catalog-bucket/
  - name: data-catalog-bucket
    policy: none
    purge: false
    versioning: false
    objectlocking: false

  # REQUIRED by argo/values.yaml -> artifactRepository.s3.bucket
  - name: argo-artifacts
    policy: none
    purge: false
    versioning: false
    objectlocking: false

  # Pre-existing. Retained -- nothing references it, but removing it would
  # drop any objects already written there.
  - name: user-catalog-bucket
    policy: none
    purge: false
    versioning: false
    objectlocking: false

policies:
  - name: polaris-sts-policy
    statements:
      - effect: Allow
        actions:
          - s3:GetObject
          - s3:PutObject
          - s3:DeleteObject
          - s3:ListBucket
          - s3:GetBucketLocation
          - s3:ListBucketMultipartUploads
          - s3:AbortMultipartUpload
        resources:
          - arn:aws:s3:::data-catalog-bucket
          - arn:aws:s3:::data-catalog-bucket/*
          - arn:aws:s3:::argo-artifacts
          - arn:aws:s3:::argo-artifacts/*
          - arn:aws:s3:::user-catalog-bucket
          - arn:aws:s3:::user-catalog-bucket/*

users: []
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: prometheus
    metricRelabelings: []

postInstall:
  enabled: true
  image:
    repository: minio/mc
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

extraEnv: []
extraVolumes: []
extraVolumeMounts: []