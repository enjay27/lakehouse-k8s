{{- if and .Values.postInstall.enabled .Values.policies }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "minio.fullname" . }}-policies
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- range .Values.policies }}
  {{ .name }}.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {{- $n := sub (len .statements) 1 }}
        {{- range $i, $s := .statements }}
        {
          "Effect": {{ $s.effect | quote }},
          "Action": {{ toJson $s.actions }},
          "Resource": {{ toJson $s.resources }}
        }{{ if lt $i $n }},{{ end }}
        {{- end }}
      ]
    }
  {{- end }}
{{- end }}
