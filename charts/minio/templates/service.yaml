apiVersion: v1
kind: Service
metadata:
  name: {{ include "minio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
      protocol: TCP
      {{- if and .Values.service.nodePort (eq .Values.service.type "NodePort") }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
      protocol: TCP
      {{- if and .Values.service.consoleNodePort (eq .Values.service.type "NodePort") }}
      nodePort: {{ .Values.service.consoleNodePort }}
      {{- end }}
  selector:
    {{- include "minio.selectorLabels" . | nindent 4 }}
---
# Headless service -- required by the StatefulSet for stable pod DNS.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "minio.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
  selector:
    {{- include "minio.selectorLabels" . | nindent 4 }}
