{{- /*
  Hourly Polaris log batch (logging/SPEC-polaris-log-batch.ko.md, logging/PLAN-polaris-log-batch-2026-09-27.md).

  A CronJob at HH:03 KST reads every pod's polaris-<pod>.log[.<hour>[.N].gz] on the log PVC and writes
  processed-logs/ aggregated-logs/ malformed/ back to it. Four objects, all gated on BOTH
  logBatch.enabled and logging.file.enabled -- without the file handler there is nothing to read:
    ConfigMap        the script, from files/log-batch/polaris_log_batch.py (.Files.Get). Every Job pod
                     reads it at start, so a new script takes effect at the next run -- no restart,
                     none of the Lua ConfigMap's "no hot reload" trap.
    ServiceAccount   for the Job only. Polaris's own SA is not reused.
    Role/RoleBinding pods get/list in this namespace, read-only: the orphan rule needs "is this pod
                     still listed?". Nothing else.
    CronJob          concurrencyPolicy Forbid (the script also flocks .state/lock).

  THE JOB POD MUST NOT CARRY polaris.selectorLabels. Those select the Polaris Service, Deployment and
  PDB; a Job pod labelled with them would receive catalog traffic. Its labels below differ in
  app.kubernetes.io/name, and the script's own pod query uses polaris.selectorLabels, so it lists
  Polaris pods and never itself.
*/ -}}
{{- if and .Values.logBatch.enabled .Values.logging.file.enabled }}
{{- $name := include "polaris.fullnameWithSuffix" (list . "log-batch") }}
{{- $claim := .Values.logging.file.storage.existingClaim | default (include "polaris.fullnameWithSuffix" (list . "logs")) }}
{{- $selector := list }}
{{- range $k, $v := (include "polaris.selectorLabels" . | fromYaml) }}
{{- $selector = append $selector (printf "%s=%s" $k $v) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-batch
data:
  polaris_log_batch.py: |-
    {{- .Files.Get "files/log-batch/polaris_log_batch.py" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-batch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-batch
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-batch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-batch
spec:
  schedule: {{ .Values.logBatch.schedule | quote }}
  {{- with .Values.logBatch.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.logBatch.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.logBatch.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.logBatch.failedJobsHistoryLimit }}
  suspend: {{ .Values.logBatch.suspend }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.logBatch.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.logBatch.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "polaris.name" . }}-log-batch
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: log-batch
          annotations:
            # records which script a run used; each Job pod reads the ConfigMap at start anyway
            checksum/script: {{ .Files.Get "files/log-batch/polaris_log_batch.py" | sha256sum }}
        spec:
          serviceAccountName: {{ $name }}
          restartPolicy: Never
          {{- if .Values.imagePullSecrets }}
          imagePullSecrets:
          {{- range .Values.imagePullSecrets }}
            - name: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- if .Values.podSecurityContext }}
          securityContext:
            {{- tpl (toYaml .Values.podSecurityContext) . | nindent 12 }}
          {{- end }}
          {{- with .Values.logBatch.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: log-batch
              image: "{{ .Values.logBatch.image.repository }}:{{ .Values.logBatch.image.tag }}"
              imagePullPolicy: {{ .Values.logBatch.image.pullPolicy }}
              {{- if .Values.containerSecurityContext }}
              securityContext:
                {{- tpl (toYaml .Values.containerSecurityContext) . | nindent 16 }}
              {{- end }}
              command: ["python3", "/opt/log-batch/polaris_log_batch.py"]
              args:
                - --log-dir={{ .Values.logging.file.logsDir }}
                - --pod-prefix={{ include "polaris.fullname" . }}-
                - --selector={{ join "," $selector }}
                {{- range .Values.logBatch.extraArgs }}
                - {{ . | quote }}
                {{- end }}
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                {{- toYaml .Values.logBatch.resources | nindent 16 }}
              volumeMounts:
                - name: logs
                  mountPath: {{ .Values.logging.file.logsDir }}
                - name: script
                  mountPath: /opt/log-batch
                  readOnly: true
          volumes:
            - name: logs
              persistentVolumeClaim:
                claimName: {{ $claim }}
            - name: script
              configMap:
                name: {{ $name }}
{{- end }}
