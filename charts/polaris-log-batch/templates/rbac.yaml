{{- /*
  Read-only, this namespace, pods only: the orphan rule's "is this Polaris pod still listed?".
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logbatch.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logbatch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "logbatch.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logbatch.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "logbatch.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logbatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "logbatch.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "logbatch.name" . }}
    namespace: {{ .Release.Namespace }}
