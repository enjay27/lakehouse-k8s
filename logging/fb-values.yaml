# ============================================================
# Fluent Bit — Polaris log shipper
#   release   fb-polaris-shipper
#   namespace datahub-hynix          (NOT `logging` — the log PVC is namespaced,
#                                     and Polaris lives here)
#   chart     fluent-bit-0.58.1      app 5.1.1
#
# This is NOT the DaemonSet. `fluent-bit/values.yaml` is that one
# (container logs -> OpenSearch in Docker). Two releases, on purpose.
#
# RECONCILED against live revision 10 on 2026-09-03. `helm get values` matched
# this file exactly, apart from key ordering and one real difference, since
# corrected here: the live release streams on `app,level`, this file had asked
# for `app,level,loggerName`. Everything below is what is deployed, plus the
# luaScripts block and the lua filter, which are new.
#
# Still NOT accounted for by this repo: `polaris-shared-logs-pvc`, mounted below
# and created by no manifest here (.memory/active-issues.md #5).
#
# Install — no --set flags, everything is in this file:
#   helm upgrade --install fb-polaris-shipper fluent/fluent-bit \
#     --version 0.58.1 -n datahub-hynix -f logging/fb-values.yaml
#
# Chart 0.58.1 renders `luaScripts` into a ConfigMap mounted at
# /fluent-bit/scripts/<key>, which is what the lua filter's `script` path points
# at. Classic `config:` is the chart's only format — there is no YAML-config
# switch to migrate to.
# ============================================================

kind: Deployment
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

extraVolumes:
  - name: polaris-logs
    persistentVolumeClaim:
      claimName: polaris-shared-logs-pvc

  # Writable scratch for the tail offset DB and the filesystem buffer. The log
  # PVC above is readOnly, so neither can live there.
  #
  # emptyDir survives a container restart (crash, OOM) but NOT pod replacement —
  # and `helm upgrade` replaces the pod. On a fresh pod the DB is empty and
  # `Read_from_Head true` re-reads the whole file, which VictoriaLogs does not
  # deduplicate. To make that survive upgrades too, create a small PVC and swap
  # the emptyDir for it:
  #     kubectl -n datahub-hynix create -f - <<'EOF'
  #     apiVersion: v1
  #     kind: PersistentVolumeClaim
  #     metadata: {name: fb-polaris-shipper-state}
  #     spec:
  #       accessModes: [ReadWriteOnce]
  #       resources: {requests: {storage: 1Gi}}
  #     EOF
  #   then:  persistentVolumeClaim: {claimName: fb-polaris-shipper-state}
  - name: flb-storage
    emptyDir:
      sizeLimit: 2Gi

extraVolumeMounts:
  - name: polaris-logs
    mountPath: /logs
    readOnly: true
  - name: flb-storage
    mountPath: /var/log/flb-storage

# Rendered by the chart into a ConfigMap and mounted at /fluent-bit/scripts/.
# This is the ONE authoritative copy of the script. To re-run its test cases:
#   python3 logging/scripts/test-access-log-parser.py
# which extracts the Lua from this file and executes it, so the tests can never
# drift from what is deployed.
luaScripts:
  polaris_access_log.lua: |
    -- polaris_access_log.lua — Fluent Bit Lua filter
    --
    -- Splits the Quarkus HTTP access-log line out of _msg into typed fields, and only
    -- for records whose loggerName is io.quarkus.http.access-log. Every other Polaris
    -- record passes through untouched.
    --
    -- Input _msg, as emitted by the pattern %h %l %u %t "%r" %s %b :
    --   192.168.194.1 - root [03/Sep/2026:06:37:47 +0000] "DELETE /api/... HTTP/1.1" 404 133
    --   \________/   ^  \__/  \____________________/       \____/ \_____/ \______/   \_/ \_/
    --    client_ip   |  user      timestamp (dropped)      method  path   version    |   |
    --                |                                                    (dropped)  |   |
    --         %l, always "-", dropped                               http_status ------+   |
    --                                                              response_size ---------+
    --
    -- Field names match §7 of logging/polaris-logging-architecture-spec.md so the
    -- LogsQL recipes there work unchanged.
    --
    -- _msg is left in place: it is the raw line, and it is what you read when the
    -- parse is wrong.

    local ACCESS_LOGGER = "io.quarkus.http.access-log"

    -- Lua patterns, not regex. %S non-space, %u uppercase, %d digit, %[ a literal [.
    -- The version token inside the quotes is consumed by [^"]* without capturing.
    local PATTERN = '^(%S+) %S+ (%S+) %[[^%]]*%] "(%u+) (%S+)[^"]*" (%d+) (%S+)'

    function polaris_access_log(tag, timestamp, record)
        if record["loggerName"] ~= ACCESS_LOGGER then
            return 0, timestamp, record   -- 0 = not modified, keep as-is
        end

        local msg = record["_msg"]
        if type(msg) ~= "string" then
            record["access_log_parse_error"] = true
            return 2, timestamp, record
        end

        local ip, user, method, path, status, size = string.match(msg, PATTERN)

        if ip == nil then
            -- Never fail silently: a line from this logger that does not parse is a
            -- pattern change, and it should be findable with
            --   access_log_parse_error:true
            record["access_log_parse_error"] = true
            return 2, timestamp, record
        end

        record["client_ip"]            = ip
        record["user_principal_name"]  = user
        record["http_method"]          = method
        record["api_path"]             = path
        record["http_status"]          = tonumber(status)

        -- %b writes "-" for a zero-byte body, which is CLF for 0, not for unknown.
        record["response_size"]        = tonumber(size) or 0

        -- 2, not 1: 1 tells Fluent Bit to take the timestamp we return as well, which
        -- round-trips it through a Lua double. 2 means "record changed, timestamp
        -- untouched", which is what actually happened here.
        return 2, timestamp, record
    end

config:
  service: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

        # Buffer to disk, not only to memory: a VictoriaLogs restart or a network
        # stall no longer costs whatever was queued.
        storage.path              /var/log/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.max_chunks_up     64
        storage.backlog.mem_limit 32M

  inputs: |
    [INPUT]
        Name              tail
        Path              /logs/polaris.log
        Tag               polaris.vlogs
        Read_from_Head    true
        Parser            json
        Buffer_Chunk_Size 256k
        Buffer_Max_Size   10MB

        # On: a line longer than Buffer_Max_Size is skipped.
        # Off (the old value): the tail STOPS on the file. Not "drops the line" —
        # stops, and stays stopped. Stack traces are the long lines.
        Skip_Long_Lines   On

        # Offset DB. Without it, every restart re-reads from byte 0 and re-posts
        # the file; VictoriaLogs does not deduplicate on ingest.
        DB                /var/log/flb-storage/polaris_tail.db
        DB.sync           normal

        # Quarkus rotates polaris.log at maxFileSize. Give the tailer time to
        # finish the rotated inode instead of losing its tail.
        Refresh_Interval  5
        Rotate_Wait       10

        storage.type      filesystem

  filters: |
    # 1. Standardize keys for VictoriaLogs.
    #    Must run before the Lua filter below, which reads _msg.
    [FILTER]
        Name          modify
        Match         polaris.vlogs
        Add           app polaris
        Rename        message _msg
        Rename        timestamp _time

    # 2. Split the Quarkus access-log line out of _msg into typed fields.
    #
    #    Gated inside the script on loggerName == io.quarkus.http.access-log;
    #    every other Polaris record returns untouched. Field names match §7 of
    #    logging/polaris-logging-architecture-spec.md, so the LogsQL recipes
    #    there work as written:
    #      client_ip  user_principal_name  http_method  api_path
    #      http_status (int)  response_size (int)
    #
    #    _msg is kept — it is the raw line, and it is what you read when the
    #    parse is wrong. A line from that logger that does NOT parse is tagged
    #    access_log_parse_error:true rather than dropped silently.
    #
    #    type_int_key stops Fluent Bit encoding these as doubles; without it
    #    VictoriaLogs stores "404.0" and numeric LogsQL filters miss.
    [FILTER]
        Name          lua
        Match         polaris.vlogs
        script        /fluent-bit/scripts/polaris_access_log.lua
        call          polaris_access_log
        type_int_key  http_status response_size

    # 3. Drop fields that cost storage on every single record and answer nothing.
    #    processName is a ~60-byte absolute JVM path; loggerClassName is the
    #    logging facade, not the logger; processId is always 1 in a container.
    #    hostName, threadName and sequence are kept — sequence in particular makes
    #    a gap in ingestion visible.
    [FILTER]
        Name          record_modifier
        Match         polaris.vlogs
        Remove_key    processName
        Remove_key    loggerClassName
        Remove_key    processId

  outputs: |
    [OUTPUT]
        Name          http
        Match         polaris.vlogs
        Host          vlsingle-victoria-logs-single-server.logging.svc.cluster.local
        Port          9428
        URI           /insert/jsonline?_msg_field=_msg&_time_field=_time&_stream_fields=app,level
        Format        json_lines
        Header        Content-Type application/json

        # Fluent Bit otherwise adds its own `date` key, which duplicates _time on
        # every record (observed: date=1788417313.911832 beside
        # _time=...13.911654221Z — 178us apart, same event).
        json_date_key false

        # With storage.type filesystem above, a VictoriaLogs outage queues to disk
        # and drains afterwards instead of being dropped.
        Retry_Limit              5
        storage.total_limit_size 1G
