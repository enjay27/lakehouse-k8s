# ============================================================
# Fluent Bit — Polaris log shipper
#   release   fb-polaris-shipper
#   namespace datahub-hynix          (NOT `logging` — the log PVC is namespaced,
#                                     and Polaris lives here)
#   chart     fluent-bit-0.58.1      app 5.1.1
#
# This is NOT the DaemonSet. `fluent-bit/values.yaml` is that one
# (container logs -> OpenSearch in Docker). Two releases, on purpose.
#
# RECONCILED against live revision 10 on 2026-09-03. `helm get values` matched
# this file exactly, apart from key ordering and one real difference, since
# corrected here: the live release streams on `app,level`, this file had asked
# for `app,level,loggerName`. Everything below is what is deployed, plus the
# luaScripts block and the lua filter, which are new.
#
# Still NOT accounted for by this repo: `polaris-shared-logs-pvc`, mounted below
# and created by no manifest here (.memory/active-issues.md #5).
#
# Install — no --set flags, everything is in this file:
#   helm upgrade --install fb-polaris-shipper fluent/fluent-bit \
#     --version 0.58.1 -n datahub-hynix -f logging/fb-values.yaml
#
# Chart 0.58.1 renders `luaScripts` into a ConfigMap mounted at
# /fluent-bit/scripts/<key>, which is what the lua filter's `script` path points
# at. Classic `config:` is the chart's only format — there is no YAML-config
# switch to migrate to.
# ============================================================

kind: Deployment
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

extraVolumes:
  - name: polaris-logs
    persistentVolumeClaim:
      claimName: polaris-shared-logs-pvc

  # Writable scratch for the tail offset DB and the filesystem buffer. The log
  # PVC above is readOnly, so neither can live there.
  #
  # emptyDir survives a container restart (crash, OOM) but NOT pod replacement —
  # and `helm upgrade` replaces the pod. On a fresh pod the DB is empty and
  # `Read_from_Head true` re-reads the whole file, which VictoriaLogs does not
  # deduplicate. To make that survive upgrades too, create a small PVC and swap
  # the emptyDir for it:
  #     kubectl -n datahub-hynix create -f - <<'EOF'
  #     apiVersion: v1
  #     kind: PersistentVolumeClaim
  #     metadata: {name: fb-polaris-shipper-state}
  #     spec:
  #       accessModes: [ReadWriteOnce]
  #       resources: {requests: {storage: 1Gi}}
  #     EOF
  #   then:  persistentVolumeClaim: {claimName: fb-polaris-shipper-state}
  - name: flb-storage
    emptyDir:
      sizeLimit: 2Gi

extraVolumeMounts:
  - name: polaris-logs
    mountPath: /logs
    readOnly: true
  - name: flb-storage
    mountPath: /var/log/flb-storage

# Rendered by the chart into a ConfigMap and mounted at /fluent-bit/scripts/.
# This is the ONE authoritative copy of the script. To re-run its test cases:
#   python3 logging/scripts/test-polaris-filters.py
# which extracts the Lua from this file and executes it, so the tests can never
# drift from what is deployed.
luaScripts:
  polaris_access_log.lua: |
    -- polaris_access_log.lua — Fluent Bit Lua filter
    --
    -- Splits the Quarkus HTTP access-log line out of _msg into typed fields, and only
    -- for records whose loggerName is io.quarkus.http.access-log. Every other Polaris
    -- record passes through untouched.
    --
    -- Input _msg, as emitted by the pattern %h %l %u %t "%r" %s %b :
    --   192.168.194.1 - root [03/Sep/2026:06:37:47 +0000] "DELETE /api/... HTTP/1.1" 404 133
    --   \________/   ^  \__/  \____________________/       \____/ \_____/ \______/   \_/ \_/
    --    client_ip   |  user      timestamp (dropped)      method  path   version    |   |
    --                |                                                    (dropped)  |   |
    --         %l, always "-", dropped                               http_status ------+   |
    --                                                              response_size ---------+
    --
    -- Field names match §7 of logging/polaris-logging-architecture-spec.md so the
    -- LogsQL recipes there work unchanged.
    --
    -- _msg is left in place: it is the raw line, and it is what you read when the
    -- parse is wrong.

    local ACCESS_LOGGER = "io.quarkus.http.access-log"

    -- Lua patterns, not regex. %S non-space, %u uppercase, %d digit, %[ a literal [.
    -- The version token inside the quotes is consumed by [^"]* without capturing.
    local PATTERN = '^(%S+) %S+ (%S+) %[[^%]]*%] "(%u+) (%S+)[^"]*" (%d+) (%S+)'

    function polaris_access_log(tag, timestamp, record)
        if record["loggerName"] ~= ACCESS_LOGGER then
            return 0, timestamp, record   -- 0 = not modified, keep as-is
        end

        local msg = record["_msg"]
        if type(msg) ~= "string" then
            record["access_log_parse_error"] = true
            return 2, timestamp, record
        end

        local ip, user, method, path, status, size = string.match(msg, PATTERN)

        if ip == nil then
            -- Never fail silently: a line from this logger that does not parse is a
            -- pattern change, and it should be findable with
            --   access_log_parse_error:true
            record["access_log_parse_error"] = true
            return 2, timestamp, record
        end

        record["client_ip"]            = ip
        record["user_principal_name"]  = user
        record["http_method"]          = method
        record["api_path"]             = path
        record["http_status"]          = tonumber(status)

        -- %b writes "-" for a zero-byte body, which is CLF for 0, not for unknown.
        record["response_size"]        = tonumber(size) or 0

        -- 2, not 1: 1 tells Fluent Bit to take the timestamp we return as well, which
        -- round-trips it through a Lua double. 2 means "record changed, timestamp
        -- untouched", which is what actually happened here.
        return 2, timestamp, record
    end

    -- ===========================================================================
    -- polaris_noise_filter — decide what is worth storing
    -- ===========================================================================
    -- Evaluated in strict order; the first rule that matches wins.
    --
    --   1. level ERROR or WARN ............................. keep
    --   2. not an access-log record ........................ keep (untouched)
    --   3. http_status >= 400 .............................. keep  <- outranks dedup
    --   4. PUT / DELETE / PATCH ............................ keep
    --   5. POST ............................................ keep
    --      POST /oauth/tokens, 2xx ......................... first per principal per KST day
    --   6. GET / HEAD on a table or view ................... first per principal per KST day
    --   7. anything else ................................... keep
    --
    -- Rule 3 above rule 6 is deliberate: a 404 on a table GET is both "a table
    -- read" and "an error", and errors win. A client hammering a missing table
    -- stays visible instead of being deduplicated into silence.

    -- ── Tunables ───────────────────────────────────────────────────────────────
    local UTC_OFFSET_HOURS = 9          -- KST. A KST day starts at 15:00 UTC.
    local DAY_ROLLOVER_UTC_HOUR = 24 - UTC_OFFSET_HOURS

    local DEDUP_METHODS       = { GET = true, HEAD = true }
    local ALWAYS_KEEP_METHODS = { PUT = true, DELETE = true, PATCH = true }

    -- Reads of these are kept once per principal per KST day. Matched against the
    -- path with its query string REMOVED: an Iceberg client varies ?snapshots=
    -- constantly and each variant used to be its own dedup key, so the 2026-09-04
    -- coverage run stored the same table three times in one day on that alone.
    --
    -- Still scoped to table and view items. Collection listings (GET .../tables) are
    -- not deduplicated at all, and twenty identical listings stored twenty records in
    -- that same run. Widening this is a separate change -- make it once
    -- fluentbit_filter_drop_records_total, now attributable per filter via Alias,
    -- says what actually dominates.
    local DEDUP_PATH_PATTERNS = {
        "/namespaces/[^/]+/tables/[^/]+",
        "/namespaces/[^/]+/views/[^/]+",
    }

    -- POSTs kept once per principal per KST day rather than every time.
    --
    -- This was a KEEP-list: POST on the table/view API kept, every other successful
    -- POST dropped. Its own comment said that drop was aimed at the OAuth token
    -- endpoint, and it was never bounded to it. The 2026-09-04 coverage run measured
    -- the cost -- create_principal, create_principal_role, create_catalog_role,
    -- create_namespace, update_namespace_properties, rename_table, rename_view and
    -- reset_principal_credentials each left no access-log record at all. A credential
    -- reset is precisely the event this pipeline exists to record.
    --
    -- Inverted, so the list names what is bounded rather than what survives: every
    -- POST is a mutation and is kept, except the endpoints below. Once per principal
    -- per day rather than never, so "who authenticated today" is answerable while
    -- per-connect token traffic stays bounded.
    local ONCE_PER_DAY_POST_PATTERNS = {
        "/oauth/tokens$",
    }

    -- Keying the dedup table on the principal multiplies it by the number of distinct
    -- principals seen in a day, held in the shipper's 512Mi, and nothing bounds it.
    -- PLACEHOLDER GUARD pending a decided cap policy: above this limit the filter
    -- stops deduplicating and keeps everything. Failing open can only store more
    -- records, never lose one.
    local DEDUP_MAX_KEYS = 50000

    -- ── KST day number ─────────────────────────────────────────────────────────
    -- Taken from the record's own _time, never from os.time(): a shipper replay
    -- must re-evaluate historical records against their own day, not against now.
    -- No tzdata, no os.date, no dependence on the container's TZ.
    local function days_from_civil(y, m, d)
        if m <= 2 then y = y - 1 end
        local era = math.floor(y / 400)
        local yoe = y - era * 400
        local mp  = (m > 2) and (m - 3) or (m + 9)
        local doy = math.floor((153 * mp + 2) / 5) + d - 1
        local doe = yoe * 365 + math.floor(yoe / 4) - math.floor(yoe / 100) + doy
        return era * 146097 + doe - 719468
    end

    local function kst_day(rfc3339)
        if type(rfc3339) ~= "string" then return nil end
        local y, m, d, h = rfc3339:match("^(%d%d%d%d)-(%d%d)-(%d%d)T(%d%d)")
        if not y then return nil end
        local day = days_from_civil(tonumber(y), tonumber(m), tonumber(d))
        if tonumber(h) >= DAY_ROLLOVER_UTC_HOUR then day = day + 1 end
        return day
    end

    -- ── State: two day buckets ─────────────────────────────────────────────────
    -- Keyed by day, so rollover drops a whole bucket instead of sweeping expired
    -- entries. Memory is bounded by one day of distinct paths. `previous` exists so
    -- a straggler arriving just after midnight does not re-log everything.
    --
    -- In memory, per pod: a shipper restart re-logs the first hit per table for the
    -- rest of that day. Accepted — the duplicate is harmless and marks the restart.
    local dedup = { day = nil, current = {}, previous = {}, n = 0 }

    local function seen_before(day, key)
        if dedup.day == nil then dedup.day = day end

        if day > dedup.day then
            if day == dedup.day + 1 then
                dedup.previous, dedup.current = dedup.current, {}
            else
                dedup.previous, dedup.current = {}, {}
            end
            dedup.day = day
            dedup.n = 0
        end

        local bucket
        if day == dedup.day then
            bucket = dedup.current
        elseif day == dedup.day - 1 then
            bucket = dedup.previous
        else
            return false     -- older than we track: keep it, do not grow state
        end

        if bucket[key] then return true end
        if dedup.n >= DEDUP_MAX_KEYS then return false end   -- fail open; see above
        bucket[key] = true
        dedup.n = dedup.n + 1
        return false
    end

    local function matches_any(path, patterns)
        for _, p in ipairs(patterns) do
            if path:find(p) then return true end
        end
        return false
    end

    -- Query string off before matching or keying. api_path itself is left alone: it
    -- is the raw path and it is what you read when something looks wrong.
    local function path_only(p)
        if type(p) ~= "string" then return "" end
        return p:match("^[^?]*") or p
    end

    -- Keep the first of this (principal, method, path) within the record's own KST
    -- day. The principal is IN the key: without it the second principal to read a
    -- table today is invisible, and "who read what" is the one question an
    -- authorization catalog's access log exists to answer.
    local function once_per_day(timestamp, record, user, method, path)
        local day = kst_day(record["_time"])
        if day == nil then return 0, timestamp, record end
        if seen_before(day, user .. " " .. method .. " " .. path) then
            return -1, timestamp, record
        end
        return 0, timestamp, record
    end

    -- ── Entry point ────────────────────────────────────────────────────────────
    function polaris_noise_filter(tag, timestamp, record)
        local level = record["level"]

        -- 1. Errors and warnings always survive.
        --    TODO: the "Deprecated Config" exclusion goes here, once the exact
        --    message is known. Match it narrowly — a broad pattern here silently
        --    discards real errors.
        if level == "ERROR" or level == "WARN" then
            return 0, timestamp, record
        end

        -- 2. Application logs pass through untouched.
        if record["loggerName"] ~= ACCESS_LOGGER then
            return 0, timestamp, record
        end

        -- 3. Anything that failed is kept. Also covers a line that did not parse,
        --    where http_status is absent — never drop what you could not read.
        local status = tonumber(record["http_status"])
        if status == nil or status >= 400 then
            return 0, timestamp, record
        end

        local method = record["http_method"]
        local path   = path_only(record["api_path"])
        local user   = record["user_principal_name"] or "-"

        -- 4. Mutations other than POST always survive.
        if ALWAYS_KEEP_METHODS[method] then
            return 0, timestamp, record
        end

        -- 5. A POST is a mutation and survives, except the endpoints listed in the
        --    tunables, which are kept once per principal per KST day.
        if method == "POST" then
            if matches_any(path, ONCE_PER_DAY_POST_PATTERNS) then
                return once_per_day(timestamp, record, user, method, path)
            end
            return 0, timestamp, record
        end

        -- 6. Reads of a table or view: one per principal per KST day.
        if DEDUP_METHODS[method] and matches_any(path, DEDUP_PATH_PATTERNS) then
            return once_per_day(timestamp, record, user, method, path)
        end

        -- 7. Everything else survives.
        return 0, timestamp, record
    end
config:
  service: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

        # Buffer to disk, not only to memory: a VictoriaLogs restart or a network
        # stall no longer costs whatever was queued.
        storage.path              /var/log/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.max_chunks_up     64
        storage.backlog.mem_limit 32M

  inputs: |
    [INPUT]
        Name              tail
        Path              /logs/polaris.log
        Tag               polaris.vlogs
        Read_from_Head    true
        Parser            json
        Buffer_Chunk_Size 256k
        Buffer_Max_Size   10MB

        # On: a line longer than Buffer_Max_Size is skipped.
        # Off (the old value): the tail STOPS on the file. Not "drops the line" —
        # stops, and stays stopped. Stack traces are the long lines.
        Skip_Long_Lines   On

        # Offset DB. Without it, every restart re-reads from byte 0 and re-posts
        # the file; VictoriaLogs does not deduplicate on ingest.
        DB                /var/log/flb-storage/polaris_tail.db
        DB.sync           normal

        # Quarkus rotates polaris.log at maxFileSize. Give the tailer time to
        # finish the rotated inode instead of losing its tail.
        Refresh_Interval  5
        Rotate_Wait       10

        storage.type      filesystem

  filters: |
    # 1. Standardize keys for VictoriaLogs.
    #    Must run before the Lua filter below, which reads _msg.
    [FILTER]
        Name          modify
        Alias         polaris_key_rename
        Match         polaris.vlogs
        Add           app polaris
        Rename        message _msg
        Rename        timestamp _time

    # 2. Split the Quarkus access-log line out of _msg into typed fields.
    #
    #    Gated inside the script on loggerName == io.quarkus.http.access-log;
    #    every other Polaris record returns untouched. Field names match §7 of
    #    logging/polaris-logging-architecture-spec.md, so the LogsQL recipes
    #    there work as written:
    #      client_ip  user_principal_name  http_method  api_path
    #      http_status (int)  response_size (int)
    #
    #    _msg is kept — it is the raw line, and it is what you read when the
    #    parse is wrong. A line from that logger that does NOT parse is tagged
    #    access_log_parse_error:true rather than dropped silently.
    #
    #    type_int_key stops Fluent Bit encoding these as doubles; without it
    #    VictoriaLogs stores "404.0" and numeric LogsQL filters miss.
    [FILTER]
        Name          lua
        Alias         polaris_access_log
        Match         polaris.vlogs
        script        /fluent-bit/scripts/polaris_access_log.lua
        call          polaris_access_log
        type_int_key  http_status response_size

    # 3. Decide what is worth storing. Drops before the field trimming below,
    #    so nothing is spent tidying a record that is about to go.
    #    Order (first match wins): ERROR/WARN keep -> non-access-log keep ->
    #    4xx/5xx keep -> PUT/DELETE/PATCH keep -> POST keep, except /oauth/tokens
    #    which is kept once per principal per KST day -> GET|HEAD on a table or view
    #    once per principal per KST day -> keep.
    #    The full rule list and the tunables are at the top of the function.
    #
    #    Alias is what makes this filter's fluentbit_filter_drop_records_total
    #    attributable: two `lua` filters are indistinguishable in the metrics without
    #    it, which is why the 2026-09-04 coverage run could report no drop delta.
    [FILTER]
        Name          lua
        Alias         polaris_noise_filter
        Match         polaris.vlogs
        script        /fluent-bit/scripts/polaris_access_log.lua
        call          polaris_noise_filter

    # 4. Drop fields that cost storage on every single record and answer nothing.
    #    processName is a ~60-byte absolute JVM path; loggerClassName is the
    #    logging facade, not the logger; processId is always 1 in a container.
    #    hostName, threadName and sequence are kept — sequence in particular makes
    #    a gap in ingestion visible.
    [FILTER]
        Name          record_modifier
        Alias         polaris_field_trim
        Match         polaris.vlogs
        Remove_key    processName
        Remove_key    loggerClassName
        Remove_key    processId

  outputs: |
    [OUTPUT]
        Name          http
        Match         polaris.vlogs
        Host          vlsingle-victoria-logs-single-server.logging.svc.cluster.local
        Port          9428
        URI           /insert/jsonline?_msg_field=_msg&_time_field=_time&_stream_fields=app,level
        Format        json_lines
        Header        Content-Type application/json

        # Fluent Bit otherwise adds its own `date` key, which duplicates _time on
        # every record (observed: date=1788417313.911832 beside
        # _time=...13.911654221Z — 178us apart, same event).
        json_date_key false

        # With storage.type filesystem above, a VictoriaLogs outage queues to disk
        # and drains afterwards instead of being dropped.
        Retry_Limit              5
        storage.total_limit_size 1G
