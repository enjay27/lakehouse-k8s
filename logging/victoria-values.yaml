# ============================================================================
# HISTORY — NOT LIVE CONFIGURATION. The `VictoriaLogs` release was UNINSTALLED on
# 2026-09-18 together with `polaris-shared-logs-pvc`
# (logging/RUNBOOK-log-pvc-removal-2026-09-18.md, executed).
#
# Nothing in this file describes anything running. It is kept, not deleted,
# because it is the only record of how that leg was configured — and, for the
# shipper, of the four silent faults found in it (no tail DB, Skip_Long_Lines
# Off stopping the tail rather than skipping, no Rotate_Wait, no filesystem
# buffering; see .memory/completed.md). Do not helm install from it to "restore"
# anything: the PVC it reads no longer exists and Polaris writes no log file.
# ============================================================================
server:
  enabled: true

  # Data retention configuration (30 days)
  retentionPeriod: "30d"

  # Persistent Volume Configuration
  persistentVolume:
    enabled: true
    size: 50Gi
    accessModes:
      - ReadWriteOnce
    # storageClassName: "gp3"
    # annotations: {}

  # Production Sizing & Protection
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  # Service Configuration (MUST be inside server)
  service:
    enabled: true
    type: LoadBalancer
    servicePort: 9428
    # annotations: {}

  # Extra flags passed to VictoriaLogs binary
  extraArgs:
    memory.allowedPercent: "60"
    http.maxGracefulShutdownDuration: "15s"

  # Probes
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

  # Ingress (Optional: also resides under server in this chart)
  ingress:
    enabled: false