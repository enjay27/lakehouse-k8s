# ============================================================
# Fluent Bit — K8s DaemonSet, release `benchmarks-fluent-bit`, ns datahub-hynix
#
# ONE release, THREE tiers, all into Docker OpenSearch 3.5.0 on the Mac
# (https://192.168.194.1:9200 — reachable from an ordinary pod; this DaemonSet
# has no hostNetwork and has been shipping there since 2026-08-19):
#
#   tier 1  kube.*         -> k8s-logs        5d    every container, unfiltered
#   tier 2  polaris.logs   -> polaris-logs-*  30d   Polaris stdout, policy v4 filtered
#   tier 3  polaris.report -> polaris-report-* 365d the flush report, schema v4
#
# Tier 1's blocks are UNCHANGED. Tiers 2 and 3 are added alongside them; nothing
# matching `kube.*` was touched. The only edit inside tier 1's reach is the image
# tag (see below).
#
# Install — chart 0.57.6, NOT a chart bump. BOTH flags, every time (see the Lua note):
#   helm upgrade --install benchmarks-fluent-bit fluent/fluent-bit \
#     --version 0.57.6 -n datahub-hynix -f fluent-bit/values.yaml \
#     --set-file 'luaScripts.polaris_access_log\.lua=fluent-bit/polaris_access_log.lua'
#
# The OpenSearch credential is NOT in this file for the new outputs; it comes from
# Secret `opensearch-shipper-credentials` via the `env:` block. Tier 1's two
# literals are still here — see the note beside them (#4).
#
# SINGLE-NODE ASSUMPTION: a DaemonSet is one pod per node and this cluster is one
# OrbStack node, so the Lua report state below lives in exactly one pod. On a
# multi-node cluster each node would keep its own window counters.
#
# Plan, gates and the eight traps: logging/PLAN-opensearch-cutover-2026-09-08.md
# ============================================================

kind: DaemonSet

# ── Image ────────────────────────────────────────────────────
image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  # 3.2.2 -> 5.1.1: the Lua chain, `type_int_key` and the report windowing were all
  # verified against 5.1.1. This is the one change that reaches TIER 1's runtime, so
  # tier 1's inputs, kubernetes filter, parsers and both k8s-logs outputs have to be
  # re-checked on it -- not just the new blocks.
  tag: "5.1.1"
  pullPolicy: IfNotPresent

# ── Ensure exactly 1 pod per node ────────────────────────────
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# ── Service account ──────────────────────────────────────────
serviceAccount:
  create: true
  name: fluent-bit

rbac:
  create: true
  nodeAccess: true
  eventsAccess: true

# ── OpenSearch credential for the tier 2/3 outputs ───────────
# Secret created out of band:
#   kubectl -n datahub-hynix create secret generic opensearch-shipper-credentials \
#     --from-literal=username=... --from-literal=password=...
# An UNDEFINED ${VAR} expands to the empty string and OpenSearch answers 401 --
# silently, past every render grep. Verify with the `OS_PASSWORD` grep in the plan.
env:
  - name: OS_USER
    valueFrom:
      secretKeyRef:
        name: opensearch-shipper-credentials
        key: username
  - name: OS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: opensearch-shipper-credentials
        key: password

# ── Resources ────────────────────────────────────────────────
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# ── Tolerations: run on all nodes ───────────────────────────
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# ── Lua ──────────────────────────────────────────────────────
# EMPTY ON PURPOSE. The script is its own file, supplied at install time:
#   fluent-bit/polaris_access_log.lua      (policy v4 / report schema v4, Korean comments)
#
#   --set-file 'luaScripts.polaris_access_log\.lua=fluent-bit/polaris_access_log.lua'
#
# Helm reads the file on the machine running helm and puts its text under this key,
# exactly as if it were written inline. Chart 0.57.6 then renders ConfigMap
# `<release>-luascripts` and mounts it at /fluent-bit/scripts/<key>, which is the
# `script` path FILTER 2 and 3 name. The pod never sees the repo file.
#
# THREE WAYS THIS GOES WRONG:
#   * --set-file FORGOTTEN on any later upgrade: luaScripts falls back to {} below, the
#     ConfigMap and its mount disappear, and both Lua filters fail to load -- CrashLoop.
#     Loud, not silent. `step2-render-gate.sh` fails on it (no APP_ALLOW in the render).
#   * The dot in the key NOT ESCAPED (`\.`): Helm makes a nested `lua` key under
#     `polaris_access_log`, the file is mounted under the wrong name, same CrashLoop.
#   * The chart passes this value through `tpl`: a double opening brace anywhere in the
#     script is parsed as a Helm template and breaks the render.
#
# `helm get values benchmarks-fluent-bit` still shows the full script text -- Helm stores
# the value, not the path -- so the running copy stays inspectable.
# step3-postupgrade.sh compares the deployed ConfigMap's sha against the repo file.
luaScripts: {}

# ── Config ───────────────────────────────────────────────────
config:

  # ── Service ────────────────────────────────────────────────
  service: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        Parsers_File  /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

        # Filesystem buffering for the tier 2/3 chain. This is SAFE for tier 1:
        # storage.path only governs inputs that declare `storage.type filesystem`,
        # and tier 1's tail does not -- it stays memory-buffered exactly as before.
        # /var/log is a hostPath on a DaemonSet, so this survives pod replacement.
        storage.path              /var/log/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.max_chunks_up     64
        storage.backlog.mem_limit 32M

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        DB                /var/log/flb_kube.db
        DB.sync           normal

    # ── TIER 2/3 — Polaris stdout, filtered ───────────────────────────────
    # Same files tier 1 tails, but its OWN DB. Sharing /var/log/flb_kube.db would
    # corrupt both offset stores.
    [INPUT]
        Name              tail
        Path              /var/log/containers/*benchmarks-polaris*.log
        Tag               polaris.logs
        # `docker, cri`, NOT `cri` alone (2026-09-09). With `cri` alone the
        # downstream `parser` filter would not touch the `log` value: 4,993
        # records in, 0 transformed, unwrap->rename delta 12.00 B/rec. Probe 5
        # tailed THE SAME FILES with the SAME parser filter and only this line
        # different, and parsed 4,314 of 4,314 -- loggerName a field, `log`
        # consumed, on every record. Tier 1 has always used `docker, cri`.
        # The mechanism is NOT established; the measurement is. See
        # .memory/sessions/2026-09-09-stdout-not-equivalent.md.
        multiline.parser  docker, cri
        Refresh_Interval  5
        Rotate_Wait       10
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        DB                /var/log/flb_polaris.db
        DB.sync           normal
        storage.type      filesystem

    # The report tick. Carries no log data: the noise filter replaces it with the
    # flush report when the window turns over and drops it otherwise. The interval
    # is NOT the report period -- WINDOW_SECONDS in the Lua is. It must stay well
    # under WINDOW_SECONDS or jitter lets a boundary pass unnoticed.
    # TEMPORARY 5s, paired with WINDOW_SECONDS 30. REVERT BOTH to 30 / 1800
    # together, as the LAST step of the cutover -- see the plan's §4.1.
    [INPUT]
        Name              dummy
        Alias             polaris_report_tick
        Tag               polaris.report
        Dummy             {"tick":"polaris-report"}
        Rate              1
        Interval_Sec      5
        Interval_NSec     0

  # ── Filters ────────────────────────────────────────────────
  filters: |
    # Enrich with K8s metadata
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off
        Labels              On

    # Parse Polaris JSON logs
    [FILTER]
        Name         parser
        Match        kube.*
        Key_Name     log
        Parser       polaris_json
        Reserve_Data On

    # Add service metadata to all logs
    [FILTER]
        Name         record_modifier
        Match        kube.*
        Record       environment dev
        Record       cluster     datahub-hynix

    # Parse Polaris plain text format (fallback if JSON disabled)
    [FILTER]
        Name         parser
        Match        kube.*benchmarks-polaris*
        Key_Name     log
        Parser       polaris_text
        Reserve_Data On

    # Parse DataHub GMS / MAE / MCE JSON logs
    # Container names: datahub-datahub-gms, datahub-datahub-mae-consumer, etc.
    [FILTER]
        Name         parser
        Match        kube.*datahub-*
        Key_Name     log
        Parser       datahub_json
        Reserve_Data On

    # ══ TIER 2/3 — the Polaris chain. Matches polaris.* ONLY; nothing above ══
    # ══ changes, and the kubernetes filter (kube.*) never sees these tags.  ══
    # Order is a contract, not a style choice.

    # 0. Unwrap the CRI envelope -- the Polaris JSON is in `log`.
    #    Uses polaris_stdout_json, NOT tier 1's polaris_json: that one has no
    #    Time_Keep and consuming `timestamp` is what gives tier 1 its @timestamp.
    [FILTER]
        Name          parser
        Alias         polaris_cri_unwrap
        Match         polaris.logs
        Key_Name      log
        Parser        polaris_stdout_json
        Reserve_Data  On

    # 1. Standardize keys. MUST run before the Lua below, which reads _msg.
    #    The names stay _msg/_time: OpenSearch 3.5.0 accepts a top-level `_msg`
    #    (probed 2026-09-08), and keeping them preserves every field name in the
    #    guide's §7 recipes, so only the query LANGUAGE changes downstream.
    [FILTER]
        Name          modify
        Alias         polaris_key_rename
        Match         polaris.logs
        Add           app polaris
        Rename        message _msg
        Rename        timestamp _time

    # 2. Split the Quarkus access-log line out of _msg into typed fields.
    #    type_int_key stops Fluent Bit encoding these as doubles.
    [FILTER]
        Name          lua
        Alias         polaris_access_log
        Match         polaris.logs
        script        /fluent-bit/scripts/polaris_access_log.lua
        call          polaris_access_log
        type_int_key  http_status response_size

    # 3. Decide what is worth storing (policy v4). v4 added app_dropped_total, dropped and
    #    commit_* to type_int_key and removed carried_rows -- every integer the Lua emits must
    #    be listed or it stores as a string and numeric queries return nothing, silently.
    #    Match is polaris.* rather than
    #    polaris.logs so the report tick reaches THIS filter instance -- Lua state
    #    is per instance and the counters live in this one.
    [FILTER]
        Name          lua
        Alias         polaris_noise_filter
        Match         polaris.*
        script        /fluent-bit/scripts/polaris_access_log.lua
        call          polaris_noise_filter
        type_int_key  schema_version report_seq window_seconds access_seen access_kept access_counted role_keys_forced counted_read counted_post errors_kept parse_errors errors_4xx errors_5xx auth_denied bytes_total distinct_resources distinct_principals resources_other resources_other_distinct principals_other windows_skipped app_dropped_total requests reads writes errors response_bytes last_read_bytes last_write_bytes commit_count commit_ms_sum commit_ms_min commit_ms_max dropped

    # 4. Drop fields that cost storage on every record and answer nothing, plus the
    #    CRI envelope leftovers. Remove_key on an absent key is a no-op, so the
    #    envelope names are listed defensively -- confirm against a real record.
    [FILTER]
        Name          record_modifier
        Alias         polaris_field_trim
        Match         polaris.logs
        Remove_key    processName
        Remove_key    loggerClassName
        Remove_key    processId
        Remove_key    logtag
        Remove_key    time

  # ── Custom parsers ─────────────────────────────────────────
  customParsers: |
    # Polaris JSON format (logging.console.json: true)
    [PARSER]
        Name        polaris_json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    # Polaris plain text fallback
    [PARSER]
        Name        polaris_text
        Format      regex
        Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?<level>[A-Z]+)\s+\[(?<logger>[^\]]+)\] \((?<thread>[^\)]+)\) \[(?<requestId>[^\]]*)\] (?<message>.+)$
        Time_Key    timestamp
        Time_Format %Y-%m-%d %H:%M:%S,%L

    # DataHub PatternLayout JSON format
    # timestamp field is text — do not use as Time_Key
    # Fluent Bit @timestamp is used for time indexing
    [PARSER]
        Name        datahub_json
        Format      json

    # Polaris stdout JSON for the TIER 2/3 chain only.
    # SEPARATE from polaris_json above, deliberately -- see the warning at the end.
    #
    # NO Time_Key HERE, ON PURPOSE (2026-09-09). It carried
    #     Time_Key    timestamp
    #     Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    #     Time_Keep   On
    # and the parse FAILED on every record: `polaris_cri_unwrap` processed 5,030
    # records, dropped 0, added 0, and the byte delta to the next filter was exactly
    # 12.00 B/record -- the cost of `Add app polaris` alone, proving `Rename message
    # _msg` and `Rename timestamp _time` both found nothing. The Polaris JSON stayed
    # a string in `log`, `loggerName` never became a field, `access_seen` read 0
    # against 270 real access-log lines, and policy v3 kept 100% of records while
    # every health check stayed green.
    #
    # Suspect was `%L` against the NINE fractional digits in `.697818537Z`, leaving
    # `818537Z` for `%z`. Not proven -- and deliberately not chased. Removing the
    # time key removes the failure mode outright instead of guessing at a format
    # that satisfies it, and it costs nothing:
    #   * `Time_Keep On` existed ONLY so `timestamp` survived for filter 1's
    #     `Rename timestamp _time`. With no Time_Key it is never consumed. Same
    #     outcome, one fewer thing to fail.
    #   * `_time` still arrives as a STRING, which the Lua replay detector requires
    #     (`if type(t) == "string"`); without it every summary row silently loses
    #     min/max_record_time.
    #   * @timestamp is unaffected because tier 2/3 already takes it from the CRI
    #     envelope, not the payload: a stored doc read 05:07:07.704Z against a
    #     payload 05:07:07.697818537Z -- 7 ms apart, precisely BECAUSE the parse
    #     was failing. There is no behaviour here to regress.
    #
    # Do NOT add Time_Key/Time_Keep to polaris_json: tier 1 depends on it consuming
    # the key. In practice polaris_json is a no-op anyway -- the `kubernetes` filter
    # above runs `Merge_Log On` with `Keep_Log Off` and deletes `log` before it. That
    # is what actually parses tier 1, and it is why tier 1's 2.6M `loggerName` docs
    # say nothing about whether either custom parser works.
    [PARSER]
        Name        polaris_stdout_json
        Format      json

  # ── Output: Docker OpenSearch on Mac ──────────────────────
  outputs: |
    # OUTPUT 1: Polaris logs — dedup via sequence field (always present)
    [OUTPUT]
        Name                opensearch
        Match               kube.*benchmarks-polaris*
        Host                192.168.194.1
        Port                9200
        HTTP_User           admin
        HTTP_Passwd         Str0ngP@ssw0rd123!
        Index               k8s-logs
        Type                _doc
        Logstash_Format     On
        Logstash_Prefix     k8s-logs
        Logstash_DateFormat %Y.%m.%d
        Time_Key            @timestamp
        Time_Key_Format     %Y-%m-%dT%H:%M:%S
        Include_Tag_Key     On
        Tag_Key             flb_tag
        Retry_Limit         3
        # Caps the buffer used to read the _bulk RESPONSE, not the request. The
        # response carries one status entry per record, so it grows with the batch;
        # the plugin default of 512 KB was being exceeded under load (#19).
        # False = unlimited, bounded in practice by the chunk size.
        Buffer_Size         False
        tls                 On
        tls.verify          Off
        Suppress_Type_Name  On
        Id_Key              sequence
        Write_Operation     upsert

    # OUTPUT 2: All other K8s logs — auto-generated _id
    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                192.168.194.1
        Port                9200
        HTTP_User           admin
        HTTP_Passwd         Str0ngP@ssw0rd123!
        Index               k8s-logs
        Type                _doc
        Logstash_Format     On
        Logstash_Prefix     k8s-logs
        Logstash_DateFormat %Y.%m.%d
        Time_Key            @timestamp
        Time_Key_Format     %Y-%m-%dT%H:%M:%S
        Include_Tag_Key     On
        Tag_Key             flb_tag
        Retry_Limit         3
        # Caps the buffer used to read the _bulk RESPONSE, not the request. The
        # response carries one status entry per record, so it grows with the batch;
        # the plugin default of 512 KB was being exceeded under load (#19).
        # False = unlimited, bounded in practice by the chunk size.
        Buffer_Size         False
        tls                 On
        tls.verify          Off
        Suppress_Type_Name  On
        Generate_ID         On

    # ══ TIER 2 — filtered Polaris logs, 30d ═════════════════════════════════
    # No `Time_Key` line, on purpose: with Logstash_Format the plugin packs
    # Time_Key PLUS every existing key, so naming a key the record already carries
    # puts two @timestamp keys in one JSON object -- which OpenSearch rejects
    # per-item INSIDE a bulk that returns HTTP 200. Trace_Error is what makes that
    # visible in the pod log; no output metric increments for it.
    [OUTPUT]
        Name                opensearch
        Match               polaris.logs
        Host                192.168.194.1
        Port                9200
        HTTP_User           ${OS_USER}
        HTTP_Passwd         ${OS_PASSWORD}
        Logstash_Format     On
        Logstash_Prefix     polaris-logs
        Logstash_DateFormat %Y.%m.%d
        Include_Tag_Key     On
        Tag_Key             flb_tag
        Retry_Limit         5
        # Caps the buffer used to read the _bulk RESPONSE, not the request. The
        # response carries one status entry per record, so it grows with the batch;
        # the plugin default of 512 KB was being exceeded under load (#19).
        # False = unlimited, bounded in practice by the chunk size.
        Buffer_Size         False
        tls                 On
        tls.verify          Off
        Suppress_Type_Name  On
        Generate_ID         On
        Trace_Error         On
        storage.total_limit_size 400M

    # ══ TIER 3 — the flush report, 365d ═════════════════════════════════════
    # Its own index because retention differs and it must: since policy v3 a
    # SUCCESSFUL READ EXISTS ONLY HERE, as an aggregate. Losing this stream loses
    # the only record that those reads happened.
    [OUTPUT]
        Name                opensearch
        Match               polaris.report
        Host                192.168.194.1
        Port                9200
        HTTP_User           ${OS_USER}
        HTTP_Passwd         ${OS_PASSWORD}
        Logstash_Format     On
        Logstash_Prefix     polaris-report
        Logstash_DateFormat %Y.%m.%d
        Retry_Limit         5
        # Caps the buffer used to read the _bulk RESPONSE, not the request. The
        # response carries one status entry per record, so it grows with the batch;
        # the plugin default of 512 KB was being exceeded under load (#19).
        # False = unlimited, bounded in practice by the chunk size.
        Buffer_Size         False
        tls                 On
        tls.verify          Off
        Suppress_Type_Name  On
        Generate_ID         On
        Trace_Error         On
        storage.total_limit_size 200M

# ── Liveness probe ───────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 2020
  initialDelaySeconds: 10
  periodSeconds: 10

# ── Readiness probe ──────────────────────────────────────────
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: 2020
  initialDelaySeconds: 5
  periodSeconds: 10