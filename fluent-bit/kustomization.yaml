# =====================================================================================
# Polaris 감사 로그 Lua 스크립트 → ConfigMap `polaris-fluent-bit-lua` (정책 v5 부터)
# =====================================================================================
# 스크립트 원본은 한 곳: fluent-bit/polaris_access_log.lua. 이 파일은 그것을 ConfigMap 으로
# 감쌀 뿐이다 (내용 복사본 없음). Helm 릴리스와 분리되어 있어서, 스크립트만 바꿀 때는
# Helm 을 거치지 않는다. 한 명령으로:
#
#   bash fluent-bit/apply-lua.sh
#
# 가 하는 일: context 가 orbstack 인지 확인 → Lua 테스트 v3–v5 + first-tick (LuaJIT) → kubectl apply -k fluent-bit/
#   → kubectl rollout restart ds/benchmarks-fluent-bit → rollout status → 파드 로그의 filter 초기화 오류 확인.
#
# hot reload 는 쓰지 않는다 (2026-09-16 결정). Fluent Bit 은 Lua 를 시작할 때만 읽는다:
#   * apply 만 하고 재시작하지 않으면 파드는 이전 스크립트로 계속 돈다. kubelet 이 마운트된 파일은
#     바꾸지만 프로세스는 다시 읽지 않으므로, 파드 안 파일을 봐도 "무엇이 돌고 있는지" 는 알 수 없다.
#   * 재시작은 Lua 상태를 초기화한다: 다음 리포트 행은 partial, report_seq 는 1 부터, 보류분 소실.
#   * 잘못된 스크립트면 재시작한 파드가 filter 초기화에 실패하고 입력 전체가 멈춘다 — tier 1(노드
#     전체 로그)도 함께 (2026-09-15 와 같은 모양). 그래서 테스트는 생략할 수 없다.
#
# Lua 와 values.yaml 을 함께 바꿀 때: bash fluent-bit/apply-lua.sh --no-restart → step2 → helm upgrade (그 사이 재시작 금지).
#   한쪽만 반영된 채 파드가 뜨면 전체 수집 정지 또는 전 액세스 라인 파싱 실패 적재 (active-issues #31).
#
# 이름 해시 접미사를 끈 이유: DaemonSet 은 values.yaml 의 extraVolumes 에서 고정 이름
# `polaris-fluent-bit-lua` 로 참조한다. 접미사를 켜면 이름이 바뀌어도 그 참조는 따라가지 않는다.
# =====================================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: datahub-hynix

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: benchmarks-fluent-bit
    app.kubernetes.io/component: polaris-lua

configMapGenerator:
  - name: polaris-fluent-bit-lua
    files:
      - polaris_access_log.lua
