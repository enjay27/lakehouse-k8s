# ============================================================
# DataHub Prerequisites — default stack
# MySQL:         enabled (default)
# Elasticsearch: enabled (default)
# Kafka:         KRaft (no Zookeeper)
# Neo4j:         disabled
# ============================================================

neo4j:
  enabled: false

kafka:
  enabled: true
  kraft:
    enabled: true
  controller:
    replicaCount: 1
  broker:
    replicaCount: 0
  zookeeper:
    enabled: false
  extraConfig: |
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    default.replication.factor=1
    min.insync.replicas=1
