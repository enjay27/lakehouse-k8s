replicaCount: 1

# Upstream chart this local chart was forked from (read it before changing templates):
#   https://github.com/apache/polaris/tree/apache-polaris-1.6.0/helm/polaris
# Polaris graduated from the incubator after 1.3.0 -- the image tag has no "-incubating" suffix.
image:
  repository: apache/polaris
  pullPolicy: IfNotPresent
  tag: "1.6.0"
  configDir: /deployments/config

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
configMapLabels: {}
revisionHistoryLimit: ~
podSecurityContext:
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10000
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: LoadBalancer
  ports:
    - name: polaris-http
      port: 8181
      targetPort: 8181
      nodePort: ~
      protocol: ~
  sessionAffinity: ~
  clusterIP: ~
  internalTrafficPolicy: ~
  externalTrafficPolicy: ~
  trafficDistribution: ~
  annotations: {}

managementService:
  type: LoadBalancer
  ports:
    - name: polaris-mgmt
      port: 8182
      targetPort: 8182
      nodePort: ~
      protocol: ~
  clusterIP: ~
  sessionAffinity: ~
  internalTrafficPolicy: ~
  externalTrafficPolicy: ~
  trafficDistribution: ~
  annotations: {}

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

# metrics-server가 클러스터에 설치되어 있어야 작동
# https://polaris.apache.org/in-dev/unreleased/helm-chart/production/#scaling
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# -- Pod을 노드별로 균등 분산 배치
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: polaris

# -- PodDisruptionBudget: 노드 drain 시 최소 가용 Pod 보장
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  # minAvailable: 1  # maxUnavailable 대신 사용 가능 (둘 중 하나만 설정)

nodeSelector:
  {}
tolerations: []
affinity: {}

# -- Configures the liveness probe for polaris pods.
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 10
  timeoutSeconds: 10
  terminationGracePeriodSeconds: 30

# -- Configures the readiness probe for polaris pods.
readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 10
  timeoutSeconds: 10

# -- OPA (Open Policy Agent) 인가 설정
# 참고: https://polaris.apache.org/releases/1.6.0/managing-security/external-pdp/opa/
opa:
  enabled: false
  # -- 인가(Authorization) 설정
  authorization:
    # -- 인가 타입: "internal" (Polaris 내장 RBAC) 또는 "opa" (외부 OPA PDP)
    type: opa
    policyUri: "http://opa.datahub-hynix.svc.cluster.local:8282/v1/data/polaris/authz"
    http:
      timeout: "PT2S"
      verifySsl: false

# -- Extra environment variables configuration.
extraEnv:
  # PostgreSQL connection settings (from Secret)
  - name: QUARKUS_DATASOURCE_JDBC_URL
    valueFrom:
      secretKeyRef:
        name: polaris-persistence-secret
        key: jdbcUrl
  - name: QUARKUS_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: polaris-persistence-secret
        key: username
  - name: QUARKUS_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: polaris-persistence-secret
        key: password
  # Connection Pool 설정
  # ── Connection validation (prevents stale connection issue) ─
  # Validates connection before handing to Polaris
  # Detects broken connections after PostgreSQL restart/restore
  - name: QUARKUS_DATASOURCE_JDBC_VALIDATE_ON_BORROW
    value: "true"
  # Background validation every 30s
  # Proactively removes dead connections from pool
  - name: QUARKUS_DATASOURCE_JDBC_BACKGROUND_VALIDATION_INTERVAL
    value: "PT30S"
  # Validation query — lightweight SELECT 1
  - name: QUARKUS_DATASOURCE_JDBC_NEW_CONNECTION_SQL
    value: "SELECT 1"
  # Connection acquisition timeout — fail fast instead of hanging
  - name: QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT
    value: "PT5S"
  - name: QUARKUS_DATASOURCE_JDBC_MIN_SIZE
    value: "10"
  - name: QUARKUS_DATASOURCE_JDBC_MAX_SIZE
    value: "300"
  - name: QUARKUS_DATASOURCE_JDBC_IDLE_REMOVAL_INTERVAL
    value: "PT2M"
  - name: QUARKUS_DATASOURCE_JDBC_MAX_LIFETIME
    value: "PT10M"
  # Bootstrap credentials (from Secret) - format: REALM,client_id,client_secret
  - name: POLARIS_BOOTSTRAP_CREDENTIALS
    valueFrom:
      secretKeyRef:
        name: polaris-persistence-secret
        key: bootstrapCredentials
  # JVM 설정 (Generational ZGC: 저지연 GC, Java 21+)
  # GC_CONTAINER_OPTIONS: 베이스 이미지의 기본 GC(ParallelGC)를 대체
  # JAVA_TOOL_OPTIONS: 힙 메모리 설정
  - name: GC_CONTAINER_OPTIONS
    value: "-XX:+UseZGC -XX:+ZGenerational"
  - name: JAVA_TOOL_OPTIONS
    value: >-
      -XX:MaxRAMPercentage=65.0
      -XX:InitialRAMPercentage=50.0

  # JSON logging for Fluent Bit (Quarkus 3.29.4 new key)
  - name: QUARKUS_LOG_CONSOLE_JSON_ENABLED
    value: "true"
  - name: QUARKUS_LOG_FILE_JSON_ENABLED
    value: "true"
  - name: QUARKUS_LOG_FILE_JSON_PRETTY_PRINT
    value: "false"
extraVolumes:
  - name: polaris-log-volume
    persistentVolumeClaim:
      claimName: polaris-shared-logs-pvc
extraVolumeMounts:
  - name: polaris-log-volume
    mountPath: /deployments/logs
extraInitContainers: []

# -- Event Listener (감사 로그): 모든 API 작업을 PostgreSQL events 테이블에 기록 (create table)
# -- https://github.com/apache/polaris/blob/apache-polaris-1.6.0/runtime/service/src/main/java/org/apache/polaris/service/events/listeners/PolarisPersistenceEventListener.java
# -- https://github.com/apache/polaris/blob/apache-polaris-1.6.0/runtime/service/src/main/java/org/apache/polaris/service/events/listeners/PolarisEventListener.java
eventListener:
  type: persistence-in-memory-buffer
  persistenceBuffer:
    bufferTime: PT5S        # 5초 간격으로 DB flush
    maxBufferSize: 1000     # 메모리 버퍼 최대 이벤트 수

# -- Tracing configuration.
tracing:
  enabled: false
  endpoint: "http://otlp-collector:4317"
  sample: "1.0d"
  attributes:
    {}

# -- Metrics configuration.
metrics:
  enabled: true
  tags:
    application: polaris

# -- ServiceMonitor: Prometheus Operator가 메트릭을 수집할 수 있도록 설정
serviceMonitor:
  enabled: false
  interval: "30s"
  labels:
    release: prometheus
  metricRelabelings: []

# -- Logging configuration
# 참고: https://polaris.apache.org/releases/1.6.0/configuration/
#      https://quarkus.io/guides/logging
logging:
  level: INFO  # 루트 로그 레벨 (QUARKUS_LOG_LEVEL)
  requestIdHeaderName: Polaris-Request-Id
  console:
    enabled: true
    threshold: INFO
    json: false
    format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) [%X{requestId}] %s%e%n"
  file:
    enabled: false
    threshold: INFO
    json: false
    format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) [%X{requestId}] %s%e%n"
    logsDir: /deployments/logs
    fileName: polaris.log
    rotation:
      maxFileSize: 10Mi
      maxBackupIndex: 5
      fileSuffix: ~  # .yyyy-MM-dd.gz
    storage:
      className: standard
      size: 5Gi
      selectorLabels: {}
  # 카테고리별 로그 레벨
  #
  # THRESHOLD GATES CATEGORIES. Quarkus applies the stricter of the category level and the
  # handler level, so while console.threshold is INFO no category below can emit DEBUG --
  # a category left at DEBUG here is inert configuration, which is the #5 / #F1 shape.
  # Every entry below is therefore INFO or OFF, and the file states what is in effect.
  #
  # To re-run the #15 ladder with the old detail, override at upgrade time instead of
  # editing this file (and set console.threshold with it, or nothing changes):
  #   helm upgrade --install benchmarks-polaris ./polaris -n datahub-hynix -f polaris/values.yaml \
  #     --set logging.console.threshold=DEBUG \
  #     --set 'logging.categories.org\.apache\.polaris\.core\.persistence=DEBUG' \
  #     --set 'logging.categories.org\.apache\.polaris\.core\.storage=DEBUG' \
  #     --set 'logging.categories.org\.apache\.polaris\.service\.storage=DEBUG'
  # The set that was DEBUG until 2026-09-18, for the record:
  #   org.apache.polaris.service.auth, .service.auth.JWTRSAKeyPairTokenBroker, .service.context,
  #   .service.catalog, .service.catalog.IcebergRestCatalogAdapter, .service.admin,
  #   org.apache.polaris.core.persistence, .service.storage, org.apache.polaris.core.storage,
  #   org.apache.polaris.persistence.relational.jdbc.DatasourceOperations,
  #   io.polaris, io.polaris.service, io.polaris.core
  categories:
    # Root
    org.apache.polaris: INFO

    # Auth — was DEBUG for the 401 investigation; demoted 2026-09-18, see note above
    org.apache.polaris.service.auth: INFO
    org.apache.polaris.service.auth.JWTRSAKeyPairTokenBroker: INFO
    org.apache.polaris.service.context: INFO

    # Security — prevent credential exposure in logs
    org.apache.polaris.service.context.ServiceProducers: "OFF"
    io.smallrye.config: "OFF"

    # Catalog / RBAC — was DEBUG for the 403 investigation; demoted 2026-09-18
    org.apache.polaris.service.catalog: INFO
    org.apache.polaris.service.catalog.IcebergRestCatalogAdapter: INFO
    org.apache.polaris.service.admin: INFO

    # Persistence — was DEBUG for the 500 entity_version investigation; demoted 2026-09-18
    org.apache.polaris.core.persistence: INFO

    # Storage — was DEBUG for the #15 NullPointerException investigation; demoted 2026-09-18
    org.apache.polaris.service.storage: INFO
    org.apache.polaris.core.storage: INFO

    # Noise suppression — INFO for high-frequency per-request loggers
    org.apache.polaris.persistence.relational.jdbc.DatasourceOperations: INFO
    org.apache.polaris.service.context.catalog.PolarisCallContextCatalogFactory: INFO
    org.apache.polaris.service.catalog.validation.IcebergPropertiesValidation: INFO
    org.apache.polaris.service.catalog.iceberg.IcebergCatalogHandler: INFO
    org.apache.polaris.service.catalog.api.IcebergRestCatalogApi: INFO
    org.apache.polaris.service.admin.api.PolarisCatalogsApi: INFO
    org.apache.polaris.service.admin.api.PolarisPrincipalsApi: INFO
    org.apache.polaris.service.admin.api.PolarisPrincipalRolesApi: INFO
    org.apache.polaris.service.auth.DefaultAuthenticator: INFO

    # Infrastructure
    io.agroal: INFO
    io.quarkus.http.access-log: INFO
    org.apache.polaris.service.events: INFO
    org.apache.iceberg.rest: INFO
    org.apache.hc.client5.http: INFO
    org.apache.iceberg.aws.s3: INFO
    software.amazon.awssdk.services.sts: INFO

    # Legacy package aliases — dead since the org.apache.polaris rename; kept only so a
    # stray third-party logger in that namespace cannot shout. Were DEBUG, which was
    # doubly inert: no such logger exists AND the console handler is at INFO.
    io.polaris: INFO
    io.polaris.service: INFO
    io.polaris.core: INFO

    # Suppress Quarkus config deprecation warnings
    io.quarkus.config: "OFF"
  mdc: {}

# -- Realm context resolver configuration.
realmContext:
  type: default
  requireHeader: true  # 프로덕션 환경에서는 realm 헤더를 필수로 요구
  realms:
    - POLARIS
    - DATACORP-PROD

# -- Polaris features configuration.
features:
  # SUPPORTED_CATALOG_STORAGE_TYPES:
  #   - S3
  #   - GCS
  #   - AZURE
  #   - FILE
  realmOverrides: {}
  ALLOW_OVERLAPPING_CATALOG_URLS: true

# -- Polaris persistence configuration.
persistence:
  type: relational-jdbc
  relationalJdbc:
    # -- Set to true to create the persistence secret during helm install
    createSecret: true
    secret:
      name: polaris-persistence-secret
      username: polaris
      password: polaris
      jdbcUrl: jdbc:postgresql://benchmarks-postgresql-postgresql-ha-pgpool:5432/polaris
      # -- Bootstrap credentials format: REALM,client_id,client_secret
      # -- 프로덕션에서는 'polaris-secret'을 안전한 랜덤 문자열로 변경해야 합니다.
      # bootstrapCredentials: POLARIS,root,polaris-secret

# -- Polaris FileIO configuration.
fileIo:
  type: default

storage:
  secret:
    name: ~

# -- Polaris authentication configuration.
# -- type: mixed (내부 토큰 우선, 실패 시 외부 OIDC 폴백)
# -- https://polaris.apache.org/releases/1.6.0/managing-security/external-idp/
authentication:
  type: mixed
  authenticator:
    type: default
  tokenService:
    type: default
  tokenBroker:
    type: rsa-key-pair
    maxTokenGeneration: PT1H
    # -- RSA key pair: Helm pre-install hook이 Secret을 자동 생성 (PKCS#8 형식)
    # -- Secret이 이미 존재하면 재생성하지 않음
    secret:
      name: polaris-rsa-key-pair-secret
      publicKey: public.pem
      privateKey: private.pem

# -- Polaris CORS configuration.
cors:
  allowedOrigins: []
  allowedMethods: []
  allowedHeaders: []
  exposedHeaders: []
  accessControlMaxAge: ~
  accessControlAllowCredentials: ~

# -- Polaris rate limiter configuration.
rateLimiter:
  type: no-op
  tokenBucket:
    type: default
    requestsPerSecond: 9999
    window: PT10S

# -- Polaris asynchronous task executor configuration.
tasks:
  # -- The maximum number of concurrent tasks that can be executed at the same time. The default is the number of available cores.
  maxConcurrentTasks: ~  # 100
  # -- The maximum number of tasks that can be queued up for execution. The default is Integer.MAX_VALUE.
  maxQueuedTasks: ~  # 1000

minio:
  enabled: true
  endpoint: http://benchmarks-minio.datahub-hynix.svc.cluster.local:9000
  existingSecret: benchmarks-minio-credentials
  region: us-east-1
  warehouse: s3://data-catalog-bucket/
  accessKeyId: minioadmin
  secretAccessKey: minioadmin

  sts:
    enabled: false
    tokenDuration: 3600

# -- Grafana Dashboard: ConfigMap으로 대시보드 자동 프로비저닝
grafanaDashboard:
  enabled: true
  labels:
    grafana_dashboard: "1"   # Grafana sidecar가 감지하는 라벨
  annotations: {}
