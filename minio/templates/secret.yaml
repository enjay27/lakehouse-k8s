{{- if not .Values.auth.existingSecret }}
{{- $pw := .Values.auth.rootPassword | default "" -}}
{{- if not $pw -}}
{{- fail "auth.rootPassword is empty. Pass it at install time, e.g. --set-string auth.rootPassword=\"$MINIO_ROOT_PASSWORD\". CLAUDE.md forbids committing it to values.yaml." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minio.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
type: Opaque
stringData:
  # --- MinIO server itself ---
  root-user: {{ .Values.auth.rootUser | quote }}
  root-password: {{ $pw | quote }}

  # --- Polaris reads these two (polaris/templates/deployment.yaml) ---
  access-key-id: {{ .Values.auth.rootUser | quote }}
  secret-access-key: {{ $pw | quote }}

  # --- Argo reads these two (argo/values.yaml artifactRepository) ---
  # Same credentials, different key names. Both sets are required: dropping
  # either one breaks that consumer at runtime, not at install time.
  access-key: {{ .Values.auth.rootUser | quote }}
  secret-key: {{ $pw | quote }}
{{- end }}
